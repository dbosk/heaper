[tool.poetry]
name = "heaper"
version = "0.1.0"
description = "A tool to prioritize among to-do's using heap queue algorithm"
authors = ["Daniel Bosk <dbosk@kth.se>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dbosk/heaper"
repository = "https://github.com/dbosk/heaper"
keywords = ["todo", "priority", "heap", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
packages = [{include = "libheaper"}]

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
